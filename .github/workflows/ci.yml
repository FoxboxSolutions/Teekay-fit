name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint · Typecheck · Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests sans base (RTL + garde service-role)
        run: npx vitest run tests/rtl.test.ts tests/no-service-role-client.test.ts

  content-strict:
    name: Contrôle de contenu (strict)
    # Échoue tant qu'il reste un placeholder [À FOURNIR …], une route
    # « comingSoon » non livrée, ou un numéro WhatsApp absent/incorrect.
    # C'est voulu : c'est la force de rappel pour livrer le contenu (M4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Contrôle strict des placeholders / routes / WhatsApp
        run: node scripts/check-placeholders.mjs --strict
        env:
          # Le vrai numéro WhatsApp vit dans l'env de déploiement ; on fournit
          # ici un numéro valide (format) pour que la CI teste la logique du
          # contrôle sans exposer le secret de production.
          NEXT_PUBLIC_WHATSAPP_NUMBER: "+213555000000"

  rls:
    name: RLS (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: supabase/setup-supabase@v1
        with:
          version: 2.122.0

      - name: Installer les dépendances
        run: npm ci

      - name: Démarrer le stack local et rejouer les migrations
        run: |
          npx supabase start
          npx supabase db reset

      - name: Tests RLS (clés exportées depuis le stack local)
        run: |
          set -a
          source <(npx supabase status -o env | sed 's/^/export /')
          set +a
          npm test
